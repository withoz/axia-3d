name: Build AXiA 3D

on:
  push:
    # 2026-04-23: claude/** 와 feature/** 를 추가해 피처 브랜치에서도 typecheck
    # 돌게 함. 이전엔 main/develop 에서만 돌아 claude/zealous-boyd에 TS 에러
    # 17개가 누적된 뒤 merge 직전에야 발견됨.
    branches: [ main, develop, 'claude/**', 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM
        working-directory: ./crates/axia-wasm
        run: wasm-pack build --target web --out-dir ../../web/src/wasm

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Run TypeScript typecheck (strict)
        working-directory: ./web
        # 2026-04-23: npm run typecheck 사용 (tsconfig strict:true 유지).
        # tsc 에러 발생 시 build 실패 → main merge 불가.
        run: npm run typecheck

      - name: Build with Vite
        working-directory: ./web
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.node-version }}
          path: web/dist/
          retention-days: 30

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Run tests
        working-directory: ./web
        # 2026-04-23: `|| echo skipped` 제거 — 테스트 실패가 CI 실패로 이어지게.
        # WASM timing 이슈는 mocks/three.ts + wasm/axia_wasm.ts 스텁으로 해결됨.
        run: npm run test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: web/coverage/
          retention-days: 7
